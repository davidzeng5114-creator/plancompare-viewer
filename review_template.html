function applyZoom(next,px=.5,py=.5){const v=$('viewport');zoom=Math.max(1,Math.min(24,next));$('sheet').style.width=baseW*zoom+'px';$('sheet').style.height=baseH*zoom+'px';$('stage').style.width=Math.max(v.clientWidth,baseW*zoom+40)+'px';$('stage').style.height=Math.max(v.clientHeight,baseH*zoom+40)+'px';$('zoomLabel').textContent=Math.round(zoom*100)+'%';changeImage();v.scrollLeft=$('sheet').offsetLeft+px*baseW*zoom-v.clientWidth/2;v.scrollTop=$('sheet').offsetTop+py*baseH*zoom-v.clientHeight/2;draw()}

$('viewport').addEventListener('wheel',e=>{e.preventDefault();centerZoom(e.deltaY<0?1.2:1/1.2)},{passive:false});$('viewport').addEventListener('pointerdown',e=>{if(e.target.closest('svg g')||e.button!==0)return;drag={x:e.clientX,y:e.clientY,l:$('viewport').scrollLeft,t:$('viewport').scrollTop};$('viewport').setPointerCapture(e.pointerId);$('viewport').classList.add('dragging')});$('viewport').addEventListener('pointermove',e=>{if(!drag)return;$('viewport').scrollLeft=drag.l+drag.x-e.clientX;$('viewport').scrollTop=drag.t+drag.y-e.clientY});for(const event of['pointerup','pointercancel'])$('viewport').addEventListener(event,()=>{drag=null;$('viewport').classList.remove('dragging')});let scrollFrame=0;$('viewport').addEventListener('scroll',()=>{if(!scrollFrame)scrollFrame=requestAnimationFrame(()=>{scrollFrame=0;draw()})},{passive:true});$('closePreview').onclick=()=>$('lightbox').close();window.addEventListener('resize',fit);
$('sources').textContent=DATA.source_labels?DATA.source_labels.old+' → '+DATA.source_labels.new:'';if(DATA.alignment_needs_review){$('warning').style.display='block';$('warning').textContent=t('對齊信心不足，請先核對對齊；所有候選仍完整列出，分類為暫定。')}function renderCoverage(){const coverage=DATA.coverage||{},notes=[],fmt=n=>Number(n).toLocaleString(lang()==='en'?'en-GB':'zh-HK'),textTotal=coverage.native_text_changes_total??coverage.text_source_total,textAccounted=coverage.native_text_changes_accounted??coverage.text_source_accounted,rasterTotal=coverage.raw_region_count??coverage.raster_region_total??coverage.raster_regions_total,headings=[];
